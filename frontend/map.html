<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Global Ship Tracker</title>


    <!-- =====================================================
         LEAFLET
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- =====================================================
         PAGE STYLE
         ===================================================== -->

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

        }


        #map {

            width: 100%;
            height: 100vh;

        }


        #metadata-filter {

            position: absolute;
            z-index: 1000;
            top: 16px;
            left: 16px;
            width: min(360px, calc(100vw - 32px));
            padding: 12px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(30, 55, 75, 0.2);
            border-radius: 8px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.2);
            font-family: Arial, sans-serif;
        }


        #metadata-filter-row {

            display: flex;
            gap: 8px;

        }


        #metadata-filter input,
        #metadata-filter select,
        #metadata-filter button {

            min-height: 34px;
            box-sizing: border-box;
            border: 1px solid #9aa8b3;
            border-radius: 4px;
            background: white;
            color: #1d2d38;
            font-size: 14px;

        }


        #metadata-filter input {

            min-width: 0;
            flex: 1;
            padding: 0 9px;

        }


        #metadata-filter select {

            width: 118px;
            padding: 0 5px;

        }


        #metadata-filter button {

            width: 34px;
            cursor: pointer;
            font-size: 18px;

        }


        #metadata-filter button:hover {

            background: #eef4f7;

        }


        #metadata-filter-status {

            display: block;
            margin-top: 7px;
            color: #425563;
            font-size: 12px;

        }


        #analysis-panel {

            position: absolute;
            z-index: 1000;
            top: 16px;
            right: 16px;
            width: min(300px, calc(100vw - 32px));
            padding: 12px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(30, 55, 75, 0.2);
            border-radius: 8px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.2);
            font-family: Arial, sans-serif;
            color: #1d2d38;
        }


        #analysis-panel h3 {

            margin: 0 0 8px;
            font-size: 15px;

        }


        #analysis-controls {

            display: flex;
            gap: 8px;

        }


        #analysis-panel select,
        #analysis-panel button {

            min-height: 32px;
            box-sizing: border-box;
            border: 1px solid #9aa8b3;
            border-radius: 4px;
            background: white;
            color: #1d2d38;
            font-size: 13px;

        }


        #analysis-panel select {

            flex: 1;
            padding: 0 5px;

        }


        #analysis-panel button {

            padding: 0 10px;
            cursor: pointer;

        }


        #analysis-panel button.active {

            background: #176b87;
            color: white;

        }


        #analysis-summary,
        #route-analysis {

            display: block;
            margin-top: 8px;
            color: #425563;
            font-size: 12px;
            line-height: 1.45;

        }


        #route-analysis {

            border-top: 1px solid #d6e0e5;
            padding-top: 8px;

        }

    </style>

</head>


<body>

    <section id="metadata-filter" aria-label="Vessel metadata filter">

        <div id="metadata-filter-row">

            <input
                id="metadata-filter-query"
                type="search"
                placeholder="Search vessel metadata"
                aria-label="Search vessel metadata"
                autocomplete="off"
            >

            <select
                id="metadata-filter-field"
                aria-label="Metadata field"
            >
                <option value="all">All fields</option>
                <option value="shipname">Name</option>
                <option value="mmsi">MMSI</option>
                <option value="imo">IMO</option>
                <option value="callsign">Call sign</option>
                <option value="shiptype">Ship type</option>
                <option value="destination">Destination</option>
            </select>

            <button
                id="metadata-filter-clear"
                type="button"
                title="Clear filter"
                aria-label="Clear filter"
            >
                x
            </button>

        </div>

        <small id="metadata-filter-status">Showing all vessels</small>

    </section>

    <section id="analysis-panel" aria-label="Traffic analysis">

        <h3>Traffic analysis</h3>

        <div id="analysis-controls">

            <select id="analysis-hours" aria-label="Traffic time window">
                <option value="24">Last 24 hours</option>
                <option value="72">Last 3 days</option>
                <option value="168">Last 7 days</option>
            </select>

            <button id="heatmap-toggle" type="button">
                Heatmap off
            </button>

        </div>

        <small id="analysis-summary">Loading traffic analysis...</small>
        <small id="route-analysis">Select a vessel for route analysis.</small>

    </section>

    <div id="map"></div>


    <!-- =====================================================
         LEAFLET JS
         ===================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script
        src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js">
    </script>


    <script>

        // =====================================================
        // API CONFIGURATION
        // =====================================================

        const VESSEL_API_URL =
            "/api/v1/vessels?limit=100";

        const HISTORY_API_URL =
            "/api/v1/vessels/history";

        const SINGLE_VESSEL_HISTORY_API_URL =
            "/api/v1/vessels";

        const TRAFFIC_ANALYSIS_API_URL =
            "/api/v1/analysis/traffic";

        const PORT_ANALYSIS_API_URL =
            "/api/v1/analysis/ports";


        // =====================================================
        // REFRESH CONFIGURATION
        // =====================================================

        const VESSEL_REFRESH_INTERVAL =
            5000;

        const HISTORY_REFRESH_INTERVAL =
            10000;

        const HISTORY_LIMIT =
            20;


        // =====================================================
        // OBSERVED TRACK CONFIGURATION
        // =====================================================

        /*
            11C-3:

            A solid line represents only observed AIS positions.

            If the database has a gap greater than 30 minutes
            between consecutive observations, the line is
            intentionally broken.

            We do NOT:
                - interpolate missing positions
                - predict a route
                - route the vessel around land
                - connect observations across long AIS gaps

            Route estimation belongs to later voyage/prediction
            stages.
        */

        const MAX_TIME_GAP_MINUTES =
            30;

        const MIN_TRACK_POINTS =
            2;


        // =====================================================
        // CREATE MAP
        // =====================================================

        const map =
            L.map("map").setView(
                [20, 0],
                2
            );

        let trafficHeatLayer = null;

        let heatmapEnabled = false;


        // =====================================================
        // OPENSTREETMAP
        // =====================================================

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {

                maxZoom: 19,

                attribution:
                    "&copy; OpenStreetMap contributors"

            }
        ).addTo(map);


        // =====================================================
        // GLOBAL DATA STORES
        // =====================================================

        const markers = {};

        /*
            One vessel can now have multiple observed-track
            segments because long AIS gaps are represented as
            breaks rather than artificial connecting lines.

            trails[mmsi] = [
                Leaflet polyline,
                Leaflet polyline,
                ...
            ]
        */
        const trails = {};

        let currentVessels = [];

        let allVessels = [];

        let filterQuery = "";

        let filterField = "all";

        let filterRefreshTimer = null;

        let vesselUpdateRunning = false;

        let historyUpdateRunning = false;

        let selectedTrailMmsi = null;

        let selectedTrailRequestId = 0;


        function vesselMetadataValue(
            vessel,
            field
        ) {

            return String(
                vessel[field] ??
                ""
            ).toLowerCase();

        }


        function filterVessels(
            vessels
        ) {

            const query =
                filterQuery.trim().toLowerCase();


            if (!query) {

                return vessels;

            }


            const fields =
                filterField === "all"
                    ? [
                        "shipname",
                        "mmsi",
                        "imo",
                        "callsign",
                        "shiptype",
                        "destination"
                    ]
                    : [filterField];


            return vessels.filter(
                vessel => fields.some(
                    field => vesselMetadataValue(
                        vessel,
                        field
                    ).includes(query)
                )
            );

        }


        function updateFilterStatus() {

            const visibleCount =
                filterVessels(allVessels).length;


            const status =
                document.getElementById(
                    "metadata-filter-status"
                );


            if (!status) {

                return;

            }


            if (!filterQuery.trim()) {

                status.textContent =
                    `Showing all ${allVessels.length} vessels`;

                return;

            }


            status.textContent =
                `${visibleCount} of ${allVessels.length} vessels match`;

        }


        function scheduleFilterRefresh() {

            updateFilterStatus();

            clearTimeout(
                filterRefreshTimer
            );

            filterRefreshTimer = setTimeout(
                updateVessels,
                150
            );

        }


        async function loadTrafficAnalysis() {

            const hours =
                document.getElementById(
                    "analysis-hours"
                ).value;

            const summary =
                document.getElementById(
                    "analysis-summary"
                );

            try {

                const response = await fetch(
                    `${TRAFFIC_ANALYSIS_API_URL}`
                    + `?hours=${hours}&grid_size=2`,
                    {cache: "no-store"}
                );

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }

                const data = await response.json();

                summary.textContent =
                    `${data.vessel_count} vessels, `
                    + `${data.point_count} AIS points, `
                    + `${data.cells.length} busy areas`;

                if (heatmapEnabled) {

                    updateTrafficHeatmap(
                        data.cells
                    );

                }

            }

            catch (error) {

                summary.textContent =
                    "Traffic analysis unavailable";
                console.error(
                    "Failed to load traffic analysis:",
                    error
                );

            }

        }


        async function loadPortAnalysis() {

            const summary =
                document.getElementById(
                    "analysis-summary"
                );

            try {

                const response = await fetch(
                    PORT_ANALYSIS_API_URL,
                    {cache: "no-store"}
                );

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }

                const data = await response.json();
                const topDestinations =
                    data.destinations
                        .slice(0, 3)
                        .map(
                            item => `${item.destination} (${item.vessel_count})`
                        )
                        .join(", ");

                if (topDestinations) {

                    summary.title =
                        `Top destinations: ${topDestinations}`;

                }

            }

            catch (error) {

                console.error(
                    "Failed to load port analysis:",
                    error
                );

            }

        }


        function updateTrafficHeatmap(cells) {

            const points = cells.map(
                cell => [
                    cell.latitude,
                    cell.longitude,
                    cell.intensity
                ]
            );

            if (trafficHeatLayer) {

                trafficHeatLayer.setLatLngs(
                    points
                );

                return;

            }

            trafficHeatLayer = L.heatLayer(
                points,
                {
                    radius: 28,
                    blur: 20,
                    maxZoom: 6,
                    minOpacity: 0.35,
                    gradient: {
                        0.2: "#4fc3f7",
                        0.5: "#ffca28",
                        0.8: "#ef6c00",
                        1.0: "#c62828"
                    }
                }
            );

            if (heatmapEnabled) {

                trafficHeatLayer.addTo(map);

            }

        }


        async function loadRouteAnalysis(mmsi) {

            const summary =
                document.getElementById(
                    "route-analysis"
                );

            summary.textContent =
                `Analyzing observed route for ${mmsi}...`;

            try {

                const response = await fetch(
                    `${SINGLE_VESSEL_HISTORY_API_URL}/`
                    + `${encodeURIComponent(mmsi)}/route?limit=100`,
                    {cache: "no-store"}
                );

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }

                const data = await response.json();
                const route = data.route;
                const speed = route.average_speed_knots;

                summary.textContent =
                    `${route.segment_count} observed segment(s), `
                    + `${route.distance_nm} nautical miles, `
                    + `average ${speed ?? "N/A"} knots`;

            }

            catch (error) {

                summary.textContent =
                    "Route analysis unavailable";
                console.error(
                    "Failed to load route analysis:",
                    error
                );

            }

        }


        // =====================================================
        // CREATE SHIP ICON
        // =====================================================

        function createShipIcon() {

            return L.divIcon({

                className: "",

                html: `
                    <div style="
                        width: 28px;
                        height: 28px;
                        background: #2196F3;
                        border-radius: 50%;
                        border: 2px solid white;
                        box-shadow:
                            0 2px 5px rgba(0,0,0,0.4);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        color: white;
                        font-size: 14px;
                    ">
                        🚢
                    </div>
                `,

                iconSize: [
                    32,
                    32
                ],

                iconAnchor: [
                    16,
                    16
                ]

            });

        }


        // =====================================================
        // CREATE POPUP
        // =====================================================

        function escapeHtml(value) {

            return String(
                value ?? ""
            ).replace(
                /[&<>'"]/g,
                character => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    "'": "&#39;",
                    "\"": "&quot;"
                })[character]
            );

        }


        function displayValue(value) {

            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {

                return "N/A";

            }

            return escapeHtml(value);

        }


        function createPopup(vessel) {

            const speed =
                vessel.sog !== null &&
                vessel.sog !== undefined
                    ? vessel.sog
                    : "N/A";


            const course =
                vessel.cog !== null &&
                vessel.cog !== undefined
                    ? vessel.cog
                    : "N/A";


            const heading =
                vessel.heading !== null &&
                vessel.heading !== undefined
                    ? vessel.heading
                    : "N/A";


            const vesselName =
                displayValue(
                    vessel.shipname ||
                    "Unknown vessel"
                );


            return `
                <div style="
                    font-family: Arial;
                    width: 280px;
                ">

                    <h4>
                        🚢 ${vesselName}
                    </h4>

                    <b>Name:</b>
                    ${vesselName}

                    <br>

                    <b>MMSI:</b>
                    ${displayValue(vessel.mmsi)}

                    <br>

                    <b>IMO:</b>
                    ${displayValue(vessel.imo)}

                    <br>

                    <b>Call sign:</b>
                    ${displayValue(vessel.callsign)}

                    <br>

                    <b>Ship type:</b>
                    ${displayValue(vessel.shiptype)}

                    <br>

                    <b>Destination:</b>
                    ${displayValue(vessel.destination)}

                    <br>

                    <b>ETA:</b>
                    ${displayValue(vessel.eta)}

                    <br><br>

                    <b>Latitude:</b>
                    ${Number(
                        vessel.latitude
                    ).toFixed(5)}

                    <br>

                    <b>Longitude:</b>
                    ${Number(
                        vessel.longitude
                    ).toFixed(5)}

                    <br>

                    <b>AIS Time:</b>
                    ${displayValue(vessel.last_seen)}

                    <br><br>

                    <b>Speed:</b>
                    ${speed} knots

                    <br>

                    <b>Course:</b>
                    ${course}°

                    <br>

                    <b>Heading:</b>
                    ${heading}°

                </div>
            `;

        }


        // =====================================================
        // PREPARE OBSERVED AIS TRACK
        // =====================================================

        function prepareObservedTrack(history) {

            if (
                !Array.isArray(history)
            ) {

                return [];

            }


            /*
                Convert coordinates to numbers and remove malformed
                AIS positions.
            */

            const points =
                history
                    .map(
                        point => {

                            const latitude =
                                Number(
                                    point.latitude ??
                                    point.lat
                                );

                            const longitude =
                                Number(
                                    point.longitude ??
                                    point.lon
                                );

                            const timestamp =
                                point.timestamp;


                            if (
                                !Number.isFinite(latitude) ||
                                !Number.isFinite(longitude) ||
                                !timestamp
                            ) {

                                return null;

                            }


                            if (
                                latitude < -90 ||
                                latitude > 90 ||
                                longitude < -180 ||
                                longitude > 180
                            ) {

                                return null;

                            }


                            /*
                                The ingestion layer already rejects
                                (0,0), but keep this guard here so the
                                map never renders it if an old/foreign
                                record appears in the API.
                            */

                            if (
                                Math.abs(latitude) < 1e-9 &&
                                Math.abs(longitude) < 1e-9
                            ) {

                                return null;

                            }


                            const parsedTime =
                                Date.parse(
                                    timestamp
                                );


                            if (
                                !Number.isFinite(
                                    parsedTime
                                )
                            ) {

                                return null;

                            }


                            return {

                                latitude,

                                longitude,

                                timestamp,

                                timeMs:
                                    parsedTime

                            };

                        }
                    )
                    .filter(
                        point => point !== null
                    );


            /*
                Always sort by AIS timestamp so the observed line
                follows chronological observation order.
            */

            points.sort(
                (
                    a,
                    b
                ) => {

                    return (
                        a.timeMs
                        -
                        b.timeMs
                    );

                }
            );


            return points;

        }


        // =====================================================
        // SPLIT OBSERVED TRACK INTO CONTINUOUS SEGMENTS
        // =====================================================

        function splitObservedTrack(
            points
        ) {

            const segments = [];

            let currentSegment = [];


            points.forEach(
                point => {

                    /*
                        First point of the vessel.
                    */

                    if (
                        currentSegment.length === 0
                    ) {

                        currentSegment.push(
                            point
                        );

                        return;

                    }


                    const previousPoint =
                        currentSegment[
                            currentSegment.length - 1
                        ];


                    const elapsedMinutes =
                        (
                            point.timeMs
                            -
                            previousPoint.timeMs
                        )
                        /
                        60000;


                    /*
                        If AIS disappeared for more than 30 minutes,
                        end the observed segment.

                        We do NOT draw a line across the gap.
                    */

                    if (
                        elapsedMinutes
                        >
                        MAX_TIME_GAP_MINUTES
                    ) {

                        if (
                            currentSegment.length
                            >=
                            MIN_TRACK_POINTS
                        ) {

                            segments.push(
                                currentSegment
                            );

                        }


                        currentSegment = [
                            point
                        ];

                        return;

                    }


                    /*
                        Continuous observation.
                    */

                    currentSegment.push(
                        point
                    );

                }
            );


            /*
                Add final segment.
            */

            if (
                currentSegment.length
                >=
                MIN_TRACK_POINTS
            ) {

                segments.push(
                    currentSegment
                );

            }


            return segments;

        }


        // =====================================================
        // REMOVE ONE VESSEL'S OBSERVED TRACK
        // =====================================================

        function removeVesselTrail(
            mmsi
        ) {

            if (
                !trails[mmsi]
            ) {

                return;

            }


            trails[mmsi].forEach(
                trail => {

                    map.removeLayer(
                        trail
                    );

                }
            );


            delete trails[mmsi];

        }


        // =====================================================
        // REMOVE ALL OBSERVED TRAILS
        // =====================================================

        function removeAllVesselTrails() {

            Object.keys(
                trails
            ).forEach(
                mmsi => {

                    removeVesselTrail(
                        mmsi
                    );

                }
            );

        }


        // =====================================================
        // UPDATE ONE VESSEL'S OBSERVED TRACK
        // =====================================================

        function updateVesselTrail(
            mmsi,
            history
        ) {

            removeVesselTrail(
                mmsi
            );


            const points =
                prepareObservedTrack(
                    history
                );


            if (
                points.length
                <
                MIN_TRACK_POINTS
            ) {

                return;

            }


            const segments =
                splitObservedTrack(
                    points
                );


            if (
                segments.length === 0
            ) {

                return;

            }


            trails[mmsi] = [];


            segments.forEach(
                segment => {

                    const coordinates =
                        segment.map(
                            point => [
                                point.latitude,
                                point.longitude
                            ]
                        );


                    /*
                        SOLID RED = observed AIS history.

                        Each segment contains only observations
                        separated by <= 30 minutes.

                        There is intentionally NO line between
                        separate segments.
                    */

                    const trail =
                        L.polyline(
                            coordinates,
                            {

                                color:
                                    "red",

                                weight:
                                    3,

                                opacity:
                                    0.85,

                                smoothFactor:
                                    1,

                                lineJoin:
                                    "round",

                                lineCap:
                                    "round"

                            }
                        ).addTo(
                            map
                        );


                    trails[mmsi].push(
                        trail
                    );

                }
            );


            console.log(
                `Observed track ${mmsi}: ` +
                `${segments.length} continuous segment(s)`
            );

        }


        // =====================================================
        // LOAD THE SELECTED VESSEL'S OBSERVED TRAIL
        // =====================================================

        async function showSelectedVesselTrail(
            mmsi
        ) {

            selectedTrailMmsi = mmsi;

            const requestId =
                ++selectedTrailRequestId;

            // The overview map deliberately has no trails.  At most
            // one trail is shown: the vessel the user is inspecting.
            removeAllVesselTrails();

            try {

                const response = await fetch(
                    `${SINGLE_VESSEL_HISTORY_API_URL}/` +
                    `${encodeURIComponent(mmsi)}/history` +
                    `?limit=${HISTORY_LIMIT}`,
                    {
                        cache: "no-store"
                    }
                );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data = await response.json();


                // A newer popup selection (or a popup close) made
                // this response irrelevant.
                if (
                    selectedTrailMmsi !== mmsi ||
                    requestId !== selectedTrailRequestId
                ) {

                    return;

                }


                updateVesselTrail(
                    mmsi,
                    data.history || []
                );

            }

            catch (error) {

                console.error(
                    "Failed to load selected vessel trail:",
                    error
                );

            }

        }


        function hideSelectedVesselTrail(
            mmsi
        ) {

            if (selectedTrailMmsi !== mmsi) {

                return;

            }

            selectedTrailMmsi = null;

            ++selectedTrailRequestId;

            removeVesselTrail(
                mmsi
            );

        }


        // =====================================================
        // UPDATE VESSEL MARKERS
        // =====================================================

        async function updateVessels() {

            if (
                vesselUpdateRunning
            ) {

                return;

            }


            vesselUpdateRunning =
                true;


            try {

                const response =
                    await fetch(
                        VESSEL_API_URL,
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                allVessels =
                    data.vessels ||
                    [];


                currentVessels =
                    filterVessels(
                        allVessels
                    );


                updateFilterStatus();


                const activeMMSIs =
                    new Set();


                currentVessels.forEach(
                    vessel => {

                        const mmsi =
                            String(
                                vessel.mmsi
                            );


                        activeMMSIs.add(
                            mmsi
                        );


                        const latitude =
                            Number(
                                vessel.latitude
                            );


                        const longitude =
                            Number(
                                vessel.longitude
                            );


                        if (
                            !Number.isFinite(
                                latitude
                            ) ||
                            !Number.isFinite(
                                longitude
                            )
                        ) {

                            return;

                        }


                        /*
                            Extra protection against invalid current
                            coordinates reaching the map.
                        */

                        if (
                            latitude < -90 ||
                            latitude > 90 ||
                            longitude < -180 ||
                            longitude > 180
                        ) {

                            return;

                        }


                        if (
                            Math.abs(latitude) < 1e-9 &&
                            Math.abs(longitude) < 1e-9
                        ) {

                            return;

                        }


                        // -------------------------------------
                        // EXISTING MARKER
                        // -------------------------------------

                        if (
                            markers[mmsi]
                        ) {

                            markers[mmsi].setLatLng(
                                [
                                    latitude,
                                    longitude
                                ]
                            );


                            markers[mmsi].setPopupContent(
                                createPopup(
                                    vessel
                                )
                            );

                        }


                        // -------------------------------------
                        // NEW MARKER
                        // -------------------------------------

                        else {

                            const marker =
                                L.marker(
                                    [
                                        latitude,
                                        longitude
                                    ],
                                    {

                                        icon:
                                            createShipIcon()

                                    }
                                );


                            marker.bindPopup(
                                createPopup(
                                    vessel
                                )
                            );


                            marker.bindTooltip(
                                mmsi
                            );


                            marker.on(
                                "popupopen",
                                () => {

                                    showSelectedVesselTrail(
                                        mmsi
                                    );

                                    loadRouteAnalysis(
                                        mmsi
                                    );

                                }
                            );


                            marker.on(
                                "popupclose",
                                () => {

                                    hideSelectedVesselTrail(
                                        mmsi
                                    );

                                }
                            );


                            marker.addTo(
                                map
                            );


                            markers[mmsi] =
                                marker;

                        }

                    }
                );


                // ---------------------------------------------
                // REMOVE INACTIVE MARKERS
                // ---------------------------------------------

                Object.keys(
                    markers
                ).forEach(
                    mmsi => {

                        if (
                            !activeMMSIs.has(
                                mmsi
                            )
                        ) {

                            map.removeLayer(
                                markers[mmsi]
                            );


                            delete markers[mmsi];


                            hideSelectedVesselTrail(
                                mmsi
                            );


                            removeVesselTrail(
                                mmsi
                            );

                        }

                    }
                );


                console.log(
                    `Updated ${currentVessels.length} visible vessels`
                );

            }

            catch (
                error
            ) {

                console.error(
                    "Failed to update vessels:",
                    error
                );

            }

            finally {

                vesselUpdateRunning =
                    false;

            }

        }


        // =====================================================
        // UPDATE OBSERVED AIS TRACKS
        // =====================================================

        async function updateTrails() {

            if (
                historyUpdateRunning
            ) {

                return;

            }


            if (
                currentVessels.length === 0
            ) {

                return;

            }


            historyUpdateRunning =
                true;


            try {

                const mmsis =
                    currentVessels
                        .map(
                            vessel =>
                                String(
                                    vessel.mmsi
                                )
                        )
                        .filter(
                            mmsi =>
                                mmsi.length > 0
                        );


                if (
                    mmsis.length === 0
                ) {

                    return;

                }


                const query =
                    mmsis
                        .map(
                            mmsi =>
                                encodeURIComponent(
                                    mmsi
                                )
                        )
                        .join(",");


                const url =
                    `${HISTORY_API_URL}` +
                    `?mmsis=${query}` +
                    `&limit=${HISTORY_LIMIT}`;


                const response =
                    await fetch(
                        url,
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                const histories =
                    data.histories ||
                    {};


                Object.entries(
                    histories
                ).forEach(
                    (
                        [
                            mmsi,
                            history
                        ]
                    ) => {

                        updateVesselTrail(
                            mmsi,
                            history
                        );

                    }
                );


                console.log(
                    `Updated trails for ${
                        Object.keys(
                            histories
                        ).length
                    } vessels`
                );

            }

            catch (
                error
            ) {

                console.error(
                    "Failed to update trails:",
                    error
                );

            }

            finally {

                historyUpdateRunning =
                    false;

            }

        }


        // =====================================================
        // INITIALIZATION
        // =====================================================

        async function initializeMapData() {

            await updateVessels();

        }


        const metadataFilterQuery =
            document.getElementById(
                "metadata-filter-query"
            );

        const metadataFilterField =
            document.getElementById(
                "metadata-filter-field"
            );

        const metadataFilterClear =
            document.getElementById(
                "metadata-filter-clear"
            );


        metadataFilterQuery.addEventListener(
            "input",
            event => {

                filterQuery = event.target.value;

                scheduleFilterRefresh();

            }
        );


        metadataFilterField.addEventListener(
            "change",
            event => {

                filterField = event.target.value;

                scheduleFilterRefresh();

            }
        );


        metadataFilterClear.addEventListener(
            "click",
            () => {

                metadataFilterQuery.value = "";
                metadataFilterField.value = "all";
                filterQuery = "";
                filterField = "all";

                scheduleFilterRefresh();

                metadataFilterQuery.focus();

            }
        );


        const analysisHours =
            document.getElementById(
                "analysis-hours"
            );

        const heatmapToggle =
            document.getElementById(
                "heatmap-toggle"
            );


        analysisHours.addEventListener(
            "change",
            () => {

                loadTrafficAnalysis();

            }
        );


        heatmapToggle.addEventListener(
            "click",
            () => {

                heatmapEnabled = !heatmapEnabled;

                heatmapToggle.textContent =
                    heatmapEnabled
                        ? "Heatmap on"
                        : "Heatmap off";

                heatmapToggle.classList.toggle(
                    "active",
                    heatmapEnabled
                );

                if (heatmapEnabled) {

                    loadTrafficAnalysis();

                    if (trafficHeatLayer) {

                        trafficHeatLayer.addTo(map);

                    }

                }

                else if (trafficHeatLayer) {

                    map.removeLayer(
                        trafficHeatLayer
                    );

                }

            }
        );


        initializeMapData();

        loadTrafficAnalysis();

        loadPortAnalysis();


        // =====================================================
        // LIVE VESSEL POSITION UPDATE
        // =====================================================

        setInterval(
            updateVessels,
            VESSEL_REFRESH_INTERVAL
        );

    </script>

</body>

</html>
