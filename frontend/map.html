<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Global Ship Tracker</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

        }

        #map {

            width: 100%;
            height: 100vh;

        }

    </style>

</head>


<body>

    <div id="map"></div>


    <!-- Leaflet JavaScript -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        // =====================================================
        // CONFIGURATION
        // =====================================================

        const API_URL = "/api/v1/vessels?limit=100";

        const REFRESH_INTERVAL = 5000;


        // =====================================================
        // CREATE MAP
        // =====================================================

        const map = L.map("map").setView(
            [20, 0],
            2
        );


        // =====================================================
        // OPENSTREETMAP
        // =====================================================

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        // =====================================================
        // STORE MARKERS
        // =====================================================

        const markers = {};


        // =====================================================
        // CREATE SHIP ICON
        // =====================================================

        function createShipIcon() {

            return L.divIcon({

                className: "",

                html: `
                    <div style="
                        width: 28px;
                        height: 28px;
                        background: #2196F3;
                        border-radius: 50%;
                        border: 2px solid white;
                        box-shadow: 0 2px 5px rgba(0,0,0,0.4);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        color: white;
                        font-size: 14px;
                    ">
                        🚢
                    </div>
                `,

                iconSize: [32, 32],

                iconAnchor: [16, 16]

            });

        }


        // =====================================================
        // CREATE POPUP
        // =====================================================

        function createPopup(vessel) {

            const speed =
                vessel.sog !== null
                    ? vessel.sog
                    : "N/A";

            const course =
                vessel.cog !== null
                    ? vessel.cog
                    : "N/A";

            const heading =
                vessel.heading !== null
                    ? vessel.heading
                    : "N/A";


            return `
                <div style="
                    font-family: Arial;
                    width: 280px;
                ">

                    <h4>
                        🚢 Unknown vessel
                    </h4>

                    <b>MMSI:</b>
                    ${vessel.mmsi}
                    <br><br>

                    <b>Latitude:</b>
                    ${Number(vessel.latitude).toFixed(5)}
                    <br>

                    <b>Longitude:</b>
                    ${Number(vessel.longitude).toFixed(5)}
                    <br>

                    <b>AIS Time:</b>
                    ${vessel.last_seen}
                    <br><br>

                    <b>Speed:</b>
                    ${speed} knots
                    <br>

                    <b>Course:</b>
                    ${course}°
                    <br>

                    <b>Heading:</b>
                    ${heading}°

                </div>
            `;

        }


        // =====================================================
        // UPDATE VESSELS
        // =====================================================

        async function updateVessels() {

            try {

                const response =
                    await fetch(API_URL, {
                        cache: "no-store"
                    });


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                const activeMMSIs =
                    new Set();


                // =============================================
                // UPDATE EXISTING / CREATE NEW MARKERS
                // =============================================

                data.vessels.forEach(
                    vessel => {

                        const mmsi =
                            String(vessel.mmsi);


                        activeMMSIs.add(mmsi);


                        const latitude =
                            Number(vessel.latitude);


                        const longitude =
                            Number(vessel.longitude);


                        if (
                            !Number.isFinite(latitude) ||
                            !Number.isFinite(longitude)
                        ) {

                            return;

                        }


                        // -----------------------------------------
                        // EXISTING VESSEL
                        // -----------------------------------------

                        if (markers[mmsi]) {

                            markers[mmsi].setLatLng([
                                latitude,
                                longitude
                            ]);


                            markers[mmsi].setPopupContent(
                                createPopup(vessel)
                            );

                        }


                        // -----------------------------------------
                        // NEW VESSEL
                        // -----------------------------------------

                        else {

                            const marker =
                                L.marker(
                                    [
                                        latitude,
                                        longitude
                                    ],
                                    {
                                        icon:
                                            createShipIcon()
                                    }
                                );


                            marker.bindPopup(
                                createPopup(vessel)
                            );


                            marker.bindTooltip(
                                mmsi
                            );


                            marker.addTo(map);


                            markers[mmsi] =
                                marker;

                        }

                    }
                );


                // =============================================
                // REMOVE VESSELS NO LONGER IN THE API RESULT
                // =============================================

                Object.keys(markers).forEach(
                    mmsi => {

                        if (
                            !activeMMSIs.has(mmsi)
                        ) {

                            map.removeLayer(
                                markers[mmsi]
                            );


                            delete markers[mmsi];

                        }

                    }
                );


                console.log(
                    `Updated ${data.vessels.length} vessels`
                );

            }


            catch (error) {

                console.error(
                    "Failed to update vessels:",
                    error
                );

            }

        }


        // =====================================================
        // INITIAL LOAD
        // =====================================================

        updateVessels();


        // =====================================================
        // CONTINUOUS DATA UPDATE
        // =====================================================

        setInterval(
            updateVessels,
            REFRESH_INTERVAL
        );

    </script>

</body>

</html>
