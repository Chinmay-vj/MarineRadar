<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Global Ship Tracker</title>


    <!-- =====================================================
         LEAFLET
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- =====================================================
         PAGE STYLE
         ===================================================== -->

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

        }


        #map {

            width: 100%;
            height: 100vh;

        }

    </style>

</head>


<body>

    <div id="map"></div>


    <!-- =====================================================
         LEAFLET JS
         ===================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>

        // =====================================================
        // API CONFIGURATION
        // =====================================================

        const VESSEL_API_URL =
            "/api/v1/vessels?limit=100";

        const HISTORY_API_URL =
            "/api/v1/vessels/history";


        // =====================================================
        // REFRESH CONFIGURATION
        // =====================================================

        const VESSEL_REFRESH_INTERVAL =
            5000;

        const HISTORY_REFRESH_INTERVAL =
            10000;

        const HISTORY_LIMIT =
            20;


        // =====================================================
        // OBSERVED TRACK CONFIGURATION
        // =====================================================

        /*
            11C-3:

            A solid line represents only observed AIS positions.

            If the database has a gap greater than 30 minutes
            between consecutive observations, the line is
            intentionally broken.

            We do NOT:
                - interpolate missing positions
                - predict a route
                - route the vessel around land
                - connect observations across long AIS gaps

            Route estimation belongs to later voyage/prediction
            stages.
        */

        const MAX_TIME_GAP_MINUTES =
            30;

        const MIN_TRACK_POINTS =
            2;


        // =====================================================
        // CREATE MAP
        // =====================================================

        const map =
            L.map("map").setView(
                [20, 0],
                2
            );


        // =====================================================
        // OPENSTREETMAP
        // =====================================================

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {

                maxZoom: 19,

                attribution:
                    "&copy; OpenStreetMap contributors"

            }
        ).addTo(map);


        // =====================================================
        // GLOBAL DATA STORES
        // =====================================================

        const markers = {};

        /*
            One vessel can now have multiple observed-track
            segments because long AIS gaps are represented as
            breaks rather than artificial connecting lines.

            trails[mmsi] = [
                Leaflet polyline,
                Leaflet polyline,
                ...
            ]
        */
        const trails = {};

        let currentVessels = [];

        let vesselUpdateRunning = false;

        let historyUpdateRunning = false;


        // =====================================================
        // CREATE SHIP ICON
        // =====================================================

        function createShipIcon() {

            return L.divIcon({

                className: "",

                html: `
                    <div style="
                        width: 28px;
                        height: 28px;
                        background: #2196F3;
                        border-radius: 50%;
                        border: 2px solid white;
                        box-shadow:
                            0 2px 5px rgba(0,0,0,0.4);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        color: white;
                        font-size: 14px;
                    ">
                        🚢
                    </div>
                `,

                iconSize: [
                    32,
                    32
                ],

                iconAnchor: [
                    16,
                    16
                ]

            });

        }


        // =====================================================
        // CREATE POPUP
        // =====================================================

        function createPopup(vessel) {

            const speed =
                vessel.sog !== null &&
                vessel.sog !== undefined
                    ? vessel.sog
                    : "N/A";


            const course =
                vessel.cog !== null &&
                vessel.cog !== undefined
                    ? vessel.cog
                    : "N/A";


            const heading =
                vessel.heading !== null &&
                vessel.heading !== undefined
                    ? vessel.heading
                    : "N/A";


            return `
                <div style="
                    font-family: Arial;
                    width: 280px;
                ">

                    <h4>
                        🚢 Unknown vessel
                    </h4>

                    <b>MMSI:</b>
                    ${vessel.mmsi}

                    <br><br>

                    <b>Latitude:</b>
                    ${Number(
                        vessel.latitude
                    ).toFixed(5)}

                    <br>

                    <b>Longitude:</b>
                    ${Number(
                        vessel.longitude
                    ).toFixed(5)}

                    <br>

                    <b>AIS Time:</b>
                    ${vessel.last_seen}

                    <br><br>

                    <b>Speed:</b>
                    ${speed} knots

                    <br>

                    <b>Course:</b>
                    ${course}°

                    <br>

                    <b>Heading:</b>
                    ${heading}°

                </div>
            `;

        }


        // =====================================================
        // PREPARE OBSERVED AIS TRACK
        // =====================================================

        function prepareObservedTrack(history) {

            if (
                !Array.isArray(history)
            ) {

                return [];

            }


            /*
                Convert coordinates to numbers and remove malformed
                AIS positions.
            */

            const points =
                history
                    .map(
                        point => {

                            const latitude =
                                Number(
                                    point.latitude ??
                                    point.lat
                                );

                            const longitude =
                                Number(
                                    point.longitude ??
                                    point.lon
                                );

                            const timestamp =
                                point.timestamp;


                            if (
                                !Number.isFinite(latitude) ||
                                !Number.isFinite(longitude) ||
                                !timestamp
                            ) {

                                return null;

                            }


                            if (
                                latitude < -90 ||
                                latitude > 90 ||
                                longitude < -180 ||
                                longitude > 180
                            ) {

                                return null;

                            }


                            /*
                                The ingestion layer already rejects
                                (0,0), but keep this guard here so the
                                map never renders it if an old/foreign
                                record appears in the API.
                            */

                            if (
                                Math.abs(latitude) < 1e-9 &&
                                Math.abs(longitude) < 1e-9
                            ) {

                                return null;

                            }


                            const parsedTime =
                                Date.parse(
                                    timestamp
                                );


                            if (
                                !Number.isFinite(
                                    parsedTime
                                )
                            ) {

                                return null;

                            }


                            return {

                                latitude,

                                longitude,

                                timestamp,

                                timeMs:
                                    parsedTime

                            };

                        }
                    )
                    .filter(
                        point => point !== null
                    );


            /*
                Always sort by AIS timestamp so the observed line
                follows chronological observation order.
            */

            points.sort(
                (
                    a,
                    b
                ) => {

                    return (
                        a.timeMs
                        -
                        b.timeMs
                    );

                }
            );


            return points;

        }


        // =====================================================
        // SPLIT OBSERVED TRACK INTO CONTINUOUS SEGMENTS
        // =====================================================

        function splitObservedTrack(
            points
        ) {

            const segments = [];

            let currentSegment = [];


            points.forEach(
                point => {

                    /*
                        First point of the vessel.
                    */

                    if (
                        currentSegment.length === 0
                    ) {

                        currentSegment.push(
                            point
                        );

                        return;

                    }


                    const previousPoint =
                        currentSegment[
                            currentSegment.length - 1
                        ];


                    const elapsedMinutes =
                        (
                            point.timeMs
                            -
                            previousPoint.timeMs
                        )
                        /
                        60000;


                    /*
                        If AIS disappeared for more than 30 minutes,
                        end the observed segment.

                        We do NOT draw a line across the gap.
                    */

                    if (
                        elapsedMinutes
                        >
                        MAX_TIME_GAP_MINUTES
                    ) {

                        if (
                            currentSegment.length
                            >=
                            MIN_TRACK_POINTS
                        ) {

                            segments.push(
                                currentSegment
                            );

                        }


                        currentSegment = [
                            point
                        ];

                        return;

                    }


                    /*
                        Continuous observation.
                    */

                    currentSegment.push(
                        point
                    );

                }
            );


            /*
                Add final segment.
            */

            if (
                currentSegment.length
                >=
                MIN_TRACK_POINTS
            ) {

                segments.push(
                    currentSegment
                );

            }


            return segments;

        }


        // =====================================================
        // REMOVE ONE VESSEL'S OBSERVED TRACK
        // =====================================================

        function removeVesselTrail(
            mmsi
        ) {

            if (
                !trails[mmsi]
            ) {

                return;

            }


            trails[mmsi].forEach(
                trail => {

                    map.removeLayer(
                        trail
                    );

                }
            );


            delete trails[mmsi];

        }


        // =====================================================
        // UPDATE ONE VESSEL'S OBSERVED TRACK
        // =====================================================

        function updateVesselTrail(
            mmsi,
            history
        ) {

            removeVesselTrail(
                mmsi
            );


            const points =
                prepareObservedTrack(
                    history
                );


            if (
                points.length
                <
                MIN_TRACK_POINTS
            ) {

                return;

            }


            const segments =
                splitObservedTrack(
                    points
                );


            if (
                segments.length === 0
            ) {

                return;

            }


            trails[mmsi] = [];


            segments.forEach(
                segment => {

                    const coordinates =
                        segment.map(
                            point => [
                                point.latitude,
                                point.longitude
                            ]
                        );


                    /*
                        SOLID RED = observed AIS history.

                        Each segment contains only observations
                        separated by <= 30 minutes.

                        There is intentionally NO line between
                        separate segments.
                    */

                    const trail =
                        L.polyline(
                            coordinates,
                            {

                                color:
                                    "red",

                                weight:
                                    3,

                                opacity:
                                    0.85,

                                smoothFactor:
                                    1,

                                lineJoin:
                                    "round",

                                lineCap:
                                    "round"

                            }
                        ).addTo(
                            map
                        );


                    trails[mmsi].push(
                        trail
                    );

                }
            );


            console.log(
                `Observed track ${mmsi}: ` +
                `${segments.length} continuous segment(s)`
            );

        }


        // =====================================================
        // UPDATE VESSEL MARKERS
        // =====================================================

        async function updateVessels() {

            if (
                vesselUpdateRunning
            ) {

                return;

            }


            vesselUpdateRunning =
                true;


            try {

                const response =
                    await fetch(
                        VESSEL_API_URL,
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                currentVessels =
                    data.vessels ||
                    [];


                const activeMMSIs =
                    new Set();


                currentVessels.forEach(
                    vessel => {

                        const mmsi =
                            String(
                                vessel.mmsi
                            );


                        activeMMSIs.add(
                            mmsi
                        );


                        const latitude =
                            Number(
                                vessel.latitude
                            );


                        const longitude =
                            Number(
                                vessel.longitude
                            );


                        if (
                            !Number.isFinite(
                                latitude
                            ) ||
                            !Number.isFinite(
                                longitude
                            )
                        ) {

                            return;

                        }


                        /*
                            Extra protection against invalid current
                            coordinates reaching the map.
                        */

                        if (
                            latitude < -90 ||
                            latitude > 90 ||
                            longitude < -180 ||
                            longitude > 180
                        ) {

                            return;

                        }


                        if (
                            Math.abs(latitude) < 1e-9 &&
                            Math.abs(longitude) < 1e-9
                        ) {

                            return;

                        }


                        // -------------------------------------
                        // EXISTING MARKER
                        // -------------------------------------

                        if (
                            markers[mmsi]
                        ) {

                            markers[mmsi].setLatLng(
                                [
                                    latitude,
                                    longitude
                                ]
                            );


                            markers[mmsi].setPopupContent(
                                createPopup(
                                    vessel
                                )
                            );

                        }


                        // -------------------------------------
                        // NEW MARKER
                        // -------------------------------------

                        else {

                            const marker =
                                L.marker(
                                    [
                                        latitude,
                                        longitude
                                    ],
                                    {

                                        icon:
                                            createShipIcon()

                                    }
                                );


                            marker.bindPopup(
                                createPopup(
                                    vessel
                                )
                            );


                            marker.bindTooltip(
                                mmsi
                            );


                            marker.addTo(
                                map
                            );


                            markers[mmsi] =
                                marker;

                        }

                    }
                );


                // ---------------------------------------------
                // REMOVE INACTIVE MARKERS
                // ---------------------------------------------

                Object.keys(
                    markers
                ).forEach(
                    mmsi => {

                        if (
                            !activeMMSIs.has(
                                mmsi
                            )
                        ) {

                            map.removeLayer(
                                markers[mmsi]
                            );


                            delete markers[mmsi];


                            removeVesselTrail(
                                mmsi
                            );

                        }

                    }
                );


                console.log(
                    `Updated ${currentVessels.length} vessels`
                );

            }

            catch (
                error
            ) {

                console.error(
                    "Failed to update vessels:",
                    error
                );

            }

            finally {

                vesselUpdateRunning =
                    false;

            }

        }


        // =====================================================
        // UPDATE OBSERVED AIS TRACKS
        // =====================================================

        async function updateTrails() {

            if (
                historyUpdateRunning
            ) {

                return;

            }


            if (
                currentVessels.length === 0
            ) {

                return;

            }


            historyUpdateRunning =
                true;


            try {

                const mmsis =
                    currentVessels
                        .map(
                            vessel =>
                                String(
                                    vessel.mmsi
                                )
                        )
                        .filter(
                            mmsi =>
                                mmsi.length > 0
                        );


                if (
                    mmsis.length === 0
                ) {

                    return;

                }


                const query =
                    mmsis
                        .map(
                            mmsi =>
                                encodeURIComponent(
                                    mmsi
                                )
                        )
                        .join(",");


                const url =
                    `${HISTORY_API_URL}` +
                    `?mmsis=${query}` +
                    `&limit=${HISTORY_LIMIT}`;


                const response =
                    await fetch(
                        url,
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                const histories =
                    data.histories ||
                    {};


                Object.entries(
                    histories
                ).forEach(
                    (
                        [
                            mmsi,
                            history
                        ]
                    ) => {

                        updateVesselTrail(
                            mmsi,
                            history
                        );

                    }
                );


                console.log(
                    `Updated trails for ${
                        Object.keys(
                            histories
                        ).length
                    } vessels`
                );

            }

            catch (
                error
            ) {

                console.error(
                    "Failed to update trails:",
                    error
                );

            }

            finally {

                historyUpdateRunning =
                    false;

            }

        }


        // =====================================================
        // INITIALIZATION
        // =====================================================

        async function initializeMapData() {

            await updateVessels();

            await updateTrails();

        }


        initializeMapData();


        // =====================================================
        // LIVE VESSEL POSITION UPDATE
        // =====================================================

        setInterval(
            updateVessels,
            VESSEL_REFRESH_INTERVAL
        );


        // =====================================================
        // LIVE TRAIL UPDATE
        // =====================================================

        setInterval(
            updateTrails,
            HISTORY_REFRESH_INTERVAL
        );

    </script>

</body>

</html>
